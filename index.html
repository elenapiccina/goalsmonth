<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Snapshot</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

:root {
  /* GENERAL */
  --ink: #454b47;
  --muted: #8d918b;
  --line: rgba(70,70,65,.14);

  --background-top: #eef1eb;
  --background-bottom: #f0e9de;

  /* STRAWBERRY — GOALS */
  --strawberry: #f3d8d5;
  --strawberry-light: #fae9e6;
  --strawberry-accent: #c99491;

  /* CAPPUCCINO — HABITS */
  --almond: #e8d8ca;
  --almond-light: #f2e8df;
  --almond-accent: #b99d85;

  /* PISTACHIO — LEARNING */
  --pistachio: #dcebd1;
  --pistachio-light: #edf5e8;
  --pistachio-accent: #9db68c;

  /* SOFT ICE BLUE/MINT — THINGS TO BUY (#F0F7F7) */
  --cappuccino: #d9eaea;
  --cappuccino-light: #f0f7f7;
  --cappuccino-accent: #82a3a3;

  /* LIME — PRACTISED */
  --lime: #c5e89b;
  --lime-dark: #4b6826;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: linear-gradient(180deg, var(--background-top) 0%, #f5f0e7 50%, var(--background-bottom) 100%);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", Arial, sans-serif;
  font-weight: 400;
}

.app {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

/* HEADER */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}

.title {
  margin: 0;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.5px;
}

.subtitle {
  margin-top: 3px;
  color: var(--muted);
  font-family: "Playfair Display", Georgia, serif;
  font-size: 12px;
  font-style: italic;
  font-weight: 400;
}

.add-menu {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255,255,255,.65);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FOCUS */
.focus-card {
  background: rgba(255,253,248,.88);
  border: 1px solid rgba(80,75,65,.14);
  border-radius: 14px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.label {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.focus-text {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.3;
  cursor: pointer;
}

/* SECTIONS */
.section {
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid rgba(80,75,65,.14);
}

.section.goals { background: var(--strawberry-light); }
.section.habits { background: var(--almond-light); }
.section.learning { background: var(--pistachio-light); }
.section.buy { background: var(--cappuccino-light); }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 15px;
  font-weight: 400;
}

.section-title-icon {
  font-size: 13px;
}

.section-count {
  color: var(--muted);
  font-family: "Plus Jakarta Sans", Arial, sans-serif;
  font-size: 9px;
  font-weight: 400;
}

.items {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ITEM */
.item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  padding: 6px 8px;
  border-radius: 8px;
  transition: opacity .15s ease, transform .15s ease;
  user-select: none;
}

.item.dragging {
  opacity: 0.4;
  transform: scale(0.98);
}

.goals .item { background: var(--strawberry); }
.habits .item { background: var(--almond); }
.learning .item { background: var(--pistachio); }
.buy .item { background: var(--cappuccino); }

.item-text {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.3;
  word-break: break-word;
  cursor: pointer;
}

.item-text.completed {
  color: var(--muted);
  text-decoration: line-through;
}

/* DOT FOR CURRENTLY LEARNING */
.learning-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: #8aa878;
  display: inline-block;
  flex-shrink: 0;
}

/* CHECKBOX */
.check {
  width: 17px;
  height: 17px;
  min-width: 17px;
  padding: 0;
  border: 1px solid rgba(70,70,65,.3);
  border-radius: 50%;
  background: rgba(255,255,255,.4);
  color: white;
  font-size: 9px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.check.done {
  background: var(--ink);
}

.drag {
  color: rgba(80,80,75,.35);
  font-size: 10px;
  cursor: grab;
  touch-action: none;
  padding: 0 2px;
}

.drag:active {
  cursor: grabbing;
}

/* STATUS BADGES */
.status-badge {
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: 400;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s ease;
}

.status-badge:hover {
  transform: scale(1.04);
}

.status-badge.now {
  background: rgba(220, 80, 70, 0.15);
  color: #923832;
}

.status-badge.soon {
  background: rgba(230, 160, 50, 0.2);
  color: #805315;
}

.status-badge.later {
  background: rgba(255, 255, 255, 0.55);
  color: var(--muted);
}

.status-badge.want {
  background: rgba(255,255,255,.55);
  color: #4b6f6f;
}

.status-badge.need {
  background: rgba(130,163,163,.35);
  color: #2e4a4a;
}

/* PRACTISED TODAY BADGE */
.practised-btn {
  border: 0;
  padding: 3px 7px;
  border-radius: 6px;
  background: rgba(255,255,255,.6);
  color: var(--muted);
  font-size: 9px;
  font-weight: 400;
  cursor: pointer;
}

.practised-btn.active {
  background: var(--lime);
  color: var(--lime-dark);
}

/* HABIT DAYS */
.habit-days {
  display: flex;
  gap: 3px;
  margin-left: auto;
}

.day {
  width: 17px;
  height: 17px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.5);
  color: var(--muted);
  font-size: 7px;
  font-weight: 400;
  cursor: pointer;
}

.day.active {
  background: var(--ink);
  color: white;
}

/* ADD AREAS & INPUTS */
.add-area {
  display: none;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}

.add-area.open {
  display: flex;
}

.input {
  flex: 1;
  min-width: 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  outline: 0;
  background: transparent;
  padding: 4px 2px;
  color: var(--ink);
  font-size: 11px;
}

.add-confirm {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}

.status-select {
  border: 0;
  border-radius: 5px;
  background: rgba(255,255,255,.7);
  color: var(--ink);
  padding: 3px 5px;
  font-size: 9px;
}

.add-section {
  width: 100%;
  margin-top: 6px;
  padding: 6px;
  border: 1px dashed rgba(80,75,65,.2);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  cursor: pointer;
}

.empty {
  padding: 4px 2px;
  color: var(--muted);
  font-family: "Playfair Display", Georgia, serif;
  font-size: 11px;
  font-style: italic;
}

.footer {
  display: flex;
  justify-content: space-between;
  padding: 4px 3px 0;
  color: var(--muted);
  font-size: 9px;
}

.clear-button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 9px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div>
      <h1 class="title">Life snapshot</h1>
      <div class="subtitle">just enough to remember what matters</div>
    </div>
    <button type="button" class="add-menu" id="globalAdd" aria-label="Add">+</button>
  </header>

  <!-- FOCUS -->
  <section class="focus-card">
    <div class="label">Right now</div>
    <div class="focus-text" id="focusText">My main focus</div>
  </section>

  <!-- GOALS -->
  <section class="section goals">
    <div class="section-header">
      <div class="section-title">
        <span class="section-title-icon">🍓</span> Goals
      </div>
      <span class="section-count" id="goalCount">0</span>
    </div>

    <div class="items" id="goalList"></div>

    <button type="button" class="add-section" data-section="goals">+ goal</button>

    <div class="add-area" id="goalsAdd">
      <input class="input" id="goalInput" maxlength="80" placeholder="what matters now?">
      <select class="status-select" id="goalStatusSelect">
        <option value="now">now</option>
        <option value="soon">soon</option>
        <option value="later">later</option>
      </select>
      <button type="button" class="add-confirm" id="goalAddConfirm">↵</button>
    </div>
  </section>

  <!-- HABITS -->
  <section class="section habits">
    <div class="section-header">
      <div class="section-title">
        <span class="section-title-icon">🌰</span> Habits
      </div>
      <span class="section-count">weekly</span>
    </div>

    <div class="items" id="habitList"></div>

    <button type="button" class="add-section" data-section="habits">+ habit</button>

    <div class="add-area" id="habitsAdd">
      <input class="input" id="habitInput" maxlength="60" placeholder="something worth repeating…">
      <button type="button" class="add-confirm" id="habitAddConfirm">↵</button>
    </div>
  </section>

  <!-- LEARNING -->
  <section class="section learning">
    <div class="section-header">
      <div class="section-title">
        <span class="section-title-icon">🧠</span> Currently learning
      </div>
      <button type="button" class="practised-btn" id="practisedBtn">practised today</button>
    </div>

    <div id="skillArea"></div>

    <button type="button" class="add-section" id="changeSkill">+ change skill</button>

    <div class="add-area" id="skillAdd">
      <input class="input" id="skillInput" maxlength="60" placeholder="one skill only…">
      <button type="button" class="add-confirm" id="skillAddConfirm">↵</button>
    </div>
  </section>

  <!-- BUY -->
  <section class="section buy">
    <div class="section-header">
      <div class="section-title">
        <span class="section-title-icon">☕</span> Things to buy
      </div>
      <span class="section-count">want / need</span>
    </div>

    <div class="items" id="buyList"></div>

    <button type="button" class="add-section" data-section="buy">+ thing to buy</button>

    <div class="add-area" id="buyAdd">
      <input class="input" id="buyInput" maxlength="60" placeholder="what do you need / want?">
      <select class="status-select" id="buyStatusSelect">
        <option value="want">want</option>
        <option value="need">need</option>
      </select>
      <button type="button" class="add-confirm" id="buyAddConfirm">↵</button>
    </div>
  </section>

  <!-- FOOTER -->
  <div class="footer">
    <span>⋮⋮ drag to rearrange</span>
    <button type="button" class="clear-button" id="clearCompleted">clear completed</button>
  </div>

</div>

<script>
(function() {
  const STORAGE_KEY = "lifeSnapshot_v4";

  let data = {
    focus: "My main focus",
    goals: [],
    habits: [],
    skill: "reading",
    lastPractised: "",
    buys: []
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) data = { ...data, ...saved };
  } catch (e) {}

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function createId() {
    return Date.now() + Math.random();
  }

  function getTodayString() {
    return new Date().toISOString().split('T')[0];
  }

  const goalList = document.getElementById("goalList");
  const habitList = document.getElementById("habitList");
  const buyList = document.getElementById("buyList");
  const skillArea = document.getElementById("skillArea");
  const focusText = document.getElementById("focusText");
  const goalCount = document.getElementById("goalCount");
  const practisedBtn = document.getElementById("practisedBtn");

  function hideAllAddAreas() {
    document.querySelectorAll(".add-area").forEach(area => area.classList.remove("open"));
  }

  function showAddArea(type) {
    hideAllAddAreas();
    const areaMap = { goals: "goalsAdd", habits: "habitsAdd", skill: "skillAdd", buy: "buyAdd" };
    const area = document.getElementById(areaMap[type]);
    if (!area) return;
    area.classList.add("open");
    const input = area.querySelector("input");
    if (input) input.focus();
  }

  document.querySelectorAll(".add-section").forEach(button => {
    button.addEventListener("click", function() {
      showAddArea(this.dataset.section || (this.id === "changeSkill" ? "skill" : ""));
    });
  });

  /* FOCUS EDIT ON CLICK */
  focusText.addEventListener("click", function() {
    const value = prompt("What is your main focus right now?", data.focus);
    if (value !== null && value.trim()) {
      data.focus = value.trim();
      save();
      renderFocus();
    }
  });

  function renderFocus() {
    focusText.textContent = data.focus || "My main focus";
  }

  /* PRACTISED TODAY */
  practisedBtn.addEventListener("click", function() {
    const today = getTodayString();
    if (data.lastPractised === today) {
      data.lastPractised = "";
    } else {
      data.lastPractised = today;
    }
    save();
    renderSkill();
  });

  /* DRAG & DROP SUPPORT */
  let draggedIndex = null;
  let draggedType = null;

  function attachDragListeners(element, index, type, reRenderFn) {
    element.setAttribute("draggable", "true");

    element.addEventListener("dragstart", (e) => {
      draggedIndex = index;
      draggedType = type;
      element.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });

    element.addEventListener("dragend", () => {
      element.classList.remove("dragging");
      draggedIndex = null;
      draggedType = null;
    });

    element.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });

    element.addEventListener("drop", (e) => {
      e.preventDefault();
      if (draggedType !== type || draggedIndex === null || draggedIndex === index) return;

      const list = data[type];
      const movedItem = list.splice(draggedIndex, 1)[0];
      list.splice(index, 0, movedItem);

      save();
      reRenderFn();
    });
  }

  /* ADD GOAL */
  function addGoal() {
    const input = document.getElementById("goalInput");
    const statusSelect = document.getElementById("goalStatusSelect");
    const text = input.value.trim();
    if (!text) return;

    data.goals.push({
      id: createId(),
      text: text,
      status: statusSelect.value || "now",
      completed: false
    });

    input.value = "";
    hideAllAddAreas();
    save();
    renderGoals();
  }

  document.getElementById("goalAddConfirm").addEventListener("click", addGoal);
  document.getElementById("goalInput").addEventListener("keydown", e => { if (e.key === "Enter") addGoal(); });

  /* CYCLE GOAL STATUS */
  function cycleGoalStatus(goal) {
    const statuses = ["now", "soon", "later"];
    const currentIdx = statuses.indexOf(goal.status || "now");
    goal.status = statuses[(currentIdx + 1) % statuses.length];
    save();
    renderGoals();
  }

  /* RENDER GOALS */
  function renderGoals() {
    goalList.innerHTML = "";
    goalCount.textContent = data.goals.length;

    if (data.goals.length === 0) {
      goalList.innerHTML = '<div class="empty">Nothing urgent yet.</div>';
      return;
    }

    data.goals.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "item";

      const dragHandle = document.createElement("span");
      dragHandle.className = "drag";
      dragHandle.textContent = "⋮⋮";

      const check = document.createElement("button");
      check.type = "button";
      check.className = "check " + (item.completed ? "done" : "");
      check.textContent = item.completed ? "✓" : "";
      check.onclick = () => {
        item.completed = !item.completed;
        save();
        renderGoals();
      };

      const text = document.createElement("span");
      text.className = "item-text " + (item.completed ? "completed" : "");
      text.textContent = item.text;
      text.onclick = () => editItemText(item, "goals");

      const badge = document.createElement("span");
      badge.className = "status-badge " + (item.status || "now");
      badge.textContent = item.status || "now";
      badge.onclick = (e) => {
        e.stopPropagation();
        cycleGoalStatus(item);
      };

      row.appendChild(dragHandle);
      row.appendChild(check);
      row.appendChild(text);
      row.appendChild(badge);

      attachDragListeners(row, index, "goals", renderGoals);
      goalList.appendChild(row);
    });
  }

  /* ADD HABIT */
  function addHabit() {
    const input = document.getElementById("habitInput");
    const text = input.value.trim();
    if (!text) return;

    data.habits.push({ id: createId(), text: text, days: [] });
    input.value = "";
    hideAllAddAreas();
    save();
    renderHabits();
  }

  document.getElementById("habitAddConfirm").addEventListener("click", addHabit);
  document.getElementById("habitInput").addEventListener("keydown", e => { if (e.key === "Enter") addHabit(); });

  function renderHabits() {
    habitList.innerHTML = "";
    if (data.habits.length === 0) {
      habitList.innerHTML = '<div class="empty">No habits set.</div>';
      return;
    }

    const dayLabels = ["M", "T", "W", "T", "F", "S", "S"];

    data.habits.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "item";

      const dragHandle = document.createElement("span");
      dragHandle.className = "drag";
      dragHandle.textContent = "⋮⋮";

      const text = document.createElement("span");
      text.className = "item-text";
      text.textContent = item.text;
      text.onclick = () => editItemText(item, "habits");

      const daysDiv = document.createElement("div");
      daysDiv.className = "habit-days";

      dayLabels.forEach((label, idx) => {
        const dayBtn = document.createElement("button");
        dayBtn.type = "button";
        dayBtn.className = "day " + (item.days && item.days.includes(idx) ? "active" : "");
        dayBtn.textContent = label;
        dayBtn.onclick = () => {
          if (!item.days) item.days = [];
          if (item.days.includes(idx)) {
            item.days = item.days.filter(d => d !== idx);
          } else {
            item.days.push(idx);
          }
          save();
          renderHabits();
        };
        daysDiv.appendChild(dayBtn);
      });

      row.appendChild(dragHandle);
      row.appendChild(text);
      row.appendChild(daysDiv);

      attachDragListeners(row, index, "habits", renderHabits);
      habitList.appendChild(row);
    });
  }

  /* RENDER SKILL */
  function renderSkill() {
    skillArea.innerHTML = "";
    const today = getTodayString();
    
    if (data.lastPractised === today) {
      practisedBtn.classList.add("active");
    } else {
      practisedBtn.classList.remove("active");
    }

    if (!data.skill) {
      skillArea.innerHTML = '<div class="empty">No active skill.</div>';
      return;
    }

    const row = document.createElement("div");
    row.className = "item";

    const dragHandle = document.createElement("span");
    dragHandle.className = "drag";
    dragHandle.textContent = "⋮⋮";

    const dot = document.createElement("span");
    dot.className = "learning-dot";

    const text = document.createElement("span");
    text.className = "item-text";
    text.textContent = data.skill;
    text.onclick = () => {
      showAddArea("skill");
    };

    row.appendChild(dragHandle);
    row.appendChild(dot);
    row.appendChild(text);
    skillArea.appendChild(row);
  }

  /* ADD SKILL */
  function addSkill() {
    const input = document.getElementById("skillInput");
    const text = input.value.trim();
    if (!text) return;

    data.skill = text;
    input.value = "";
    hideAllAddAreas();
    save();
    renderSkill();
  }

  document.getElementById("skillAddConfirm").addEventListener("click", addSkill);
  document.getElementById("skillInput").addEventListener("keydown", e => { if (e.key === "Enter") addSkill(); });

  /* ADD BUY */
  function addBuy() {
    const input = document.getElementById("buyInput");
    const statusSelect = document.getElementById("buyStatusSelect");
    const text = input.value.trim();
    if (!text) return;

    data.buys.push({
      id: createId(),
      text: text,
      status: statusSelect.value || "want"
    });

    input.value = "";
    hideAllAddAreas();
    save();
    renderBuys();
  }

  document.getElementById("buyAddConfirm").addEventListener("click", addBuy);
  document.getElementById("buyInput").addEventListener("keydown", e => { if (e.key === "Enter") addBuy(); });

  function cycleBuyStatus(item) {
    item.status = item.status === "want" ? "need" : "want";
    save();
    renderBuys();
  }

  function renderBuys() {
    buyList.innerHTML = "";
    if (data.buys.length === 0) {
      buyList.innerHTML = '<div class="empty">Wishlist empty.</div>';
      return;
    }

    data.buys.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "item";

      const dragHandle = document.createElement("span");
      dragHandle.className = "drag";
      dragHandle.textContent = "⋮⋮";

      const text = document.createElement("span");
      text.className = "item-text";
      text.textContent = item.text;
      text.onclick = () => editItemText(item, "buys");

      const badge = document.createElement("span");
      badge.className = "status-badge " + (item.status || "want");
      badge.textContent = item.status || "want";
      badge.onclick = (e) => {
        e.stopPropagation();
        cycleBuyStatus(item);
      };

      row.appendChild(dragHandle);
      row.appendChild(text);
      row.appendChild(badge);

      attachDragListeners(row, index, "buys", renderBuys);
      buyList.appendChild(row);
    });
  }

  /* INLINE EDIT TASK TEXT */
  function editItemText(item, type) {
    const newText = prompt("Edit text:", item.text);
    if (newText !== null && newText.trim()) {
      item.text = newText.trim();
      save();
      if (type === "goals") renderGoals();
      if (type === "habits") renderHabits();
      if (type === "buys") renderBuys();
    }
  }

  /* CLEAR COMPLETED */
  document.getElementById("clearCompleted").addEventListener("click", function() {
    data.goals = data.goals.filter(g => !g.completed);
    save();
    renderGoals();
  });

  /* INITIAL RENDER */
  renderFocus();
  renderGoals();
  renderHabits();
  renderSkill();
  renderBuys();

})();
</script>
</body>
</html>
